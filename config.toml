[plugin]
enabled = true
config_version = "4.0.0"

[autonomous_planning]
cleanup_interval = 3600
cleanup_old_goals_days = 30

[autonomous_planning.schedule]
# 注入功能
inject_schedule = true
auto_generate = true

# 自定义提示词
custom_prompt = ""

# 次日策略推断
auto_infer_next_day_prompt = false
infer_time = "22:30"
infer_lookback_days = 3
infer_max_prompt_chars = 300
infer_use_completion_signal = true

# 注入显示
max_future_activities = 3

# 多轮生成
use_multi_round = true
max_rounds = 2
quality_threshold = 0.85

# 生成参数
min_activities = 8
max_activities = 15
enable_detailed_description = true
min_description_length = 20
max_description_length = 50
max_tokens = 8192
generation_timeout = 180.0

# 缓存
cache_ttl = 300
cache_max_size = 100

# 定时自动生成
auto_schedule_enabled = true
auto_schedule_time = "00:30"
timezone = "Asia/Shanghai"

# 权限
admin_users = []

# v4 新增：LLM 任务名（需在主程序 model_config.toml 中预先配置）
llm_task_name = "replyer"

[autonomous_planning.schedule.inject]
inject_mode = "smart"
enable_intent_classification = true
enable_state_analysis = true
enable_inject_optimization = true
casual_chat_inject_probability = 0.5
context_max_turns = 3
context_ttl = 600
